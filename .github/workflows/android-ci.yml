name: Android CI

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: android-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Test, lint, and assemble
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out source
              uses: actions/checkout@v6

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: gradle

            - name: Install Android 16 and native toolchains
              shell: bash
              run: |
                  BRAM_SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                  set +o pipefail
                  yes | "$BRAM_SDKMANAGER" --licenses >/dev/null
                  set -o pipefail
                  "$BRAM_SDKMANAGER" \
                    "platforms;android-36" \
                    "build-tools;36.0.0" \
                    "ndk;28.2.13676358" \
                    "cmake;3.22.1"

            - name: Verify Gradle wrapper and build
              shell: bash
              run: |
                  chmod +x gradlew
                  ./gradlew --no-daemon --stacktrace \
                    :core:agent:test \
                    :runtime:llamacpp:testDebugUnitTest \
                    :platform:android:lintDebug \
                    :runtime:openai:lintDebug \
                    :runtime:llamacpp:lintDebug \
                    :app:lintDebug \
                    :app:assembleDebug

            - name: Upload debug APK
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: bram-debug-${{ github.sha }}
                  path: app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload verification reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bram-verification-${{ github.sha }}
                  path: |
                      **/build/reports/tests/
                      **/build/reports/lint-results-debug.html
                      **/build/reports/lint-results-debug.xml
                  if-no-files-found: warn
                  retention-days: 14

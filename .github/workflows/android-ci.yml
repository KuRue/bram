name: Android CI

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: android-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Test, lint, and assemble
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out source
              uses: actions/checkout@v6

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: gradle

            # :runtime:litertlm's unit tests fork a JDK 21 JVM, because the LiteRT-LM AAR ships
            # Java 21 bytecode. Gradle does not scan the runner's tool cache for JDKs, so this one
            # has to be pointed at by hand (see the step below). No cache here: two setup-java
            # steps writing the same cache key would fight over the restore.
            - name: Set up JDK 21 for the LiteRT-LM tests
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Register the JDK 21 toolchain with Gradle
              shell: bash
              run: |
                  # Loud if the setup step did not export it: an empty path here would otherwise
                  # make :runtime:litertlm's tests fail much later with an opaque toolchain error.
                  : "${JAVA_HOME_21_X64:?setup-java did not export JAVA_HOME_21_X64}"
                  echo "org.gradle.java.installations.paths=$JAVA_HOME_21_X64" >> "$HOME/.gradle/gradle.properties"
                  # Gradle itself stays on 17; only the forked test JVM is newer. The last
                  # setup-java step left JAVA_HOME pointing at 21.
                  echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

            - name: Install Android 16 and native toolchains
              shell: bash
              run: |
                  BRAM_SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                  set +o pipefail
                  yes | "$BRAM_SDKMANAGER" --licenses >/dev/null
                  set -o pipefail
                  "$BRAM_SDKMANAGER" \
                    "platforms;android-36" \
                    "build-tools;36.0.0" \
                    "ndk;28.2.13676358" \
                    "cmake;3.30.5"

            # Every unit test in the project, not a sample of them. These six modules were the whole
            # suite as of 2026-10-06 (546 tests); CI used to run two of them, which left every change
            # to :core:domain, :runtime:openai, :runtime:litertlm and :app unverified until
            # somebody remembered to run the rest by hand.
            - name: Verify Gradle wrapper, test, lint, and build
              shell: bash
              run: |
                  chmod +x gradlew
                  ./gradlew --no-daemon --stacktrace \
                    :core:domain:test \
                    :core:agent:test \
                    :runtime:openai:testDebugUnitTest \
                    :runtime:llamacpp:testDebugUnitTest \
                    :runtime:litertlm:testDebugUnitTest \
                    :app:testDebugUnitTest \
                    :platform:android:lintDebug \
                    :runtime:openai:lintDebug \
                    :runtime:llamacpp:lintDebug \
                    :runtime:litertlm:lintDebug \
                    :app:lintDebug \
                    :app:assembleDebug

            - name: Upload debug APK
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: bram-debug-${{ github.sha }}
                  path: app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload verification reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bram-verification-${{ github.sha }}
                  path: |
                      **/build/reports/tests/
                      **/build/reports/lint-results-debug.html
                      **/build/reports/lint-results-debug.xml
                  if-no-files-found: warn
                  retention-days: 14

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bram proposed layouts</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:var(--foreground,#edeae5)}
.note{font-size:13px;color:var(--muted-foreground,#777);margin:0 0 14px;line-height:1.6}
.stage{--bg:#0e0e11;--surface:#1a1a1f;--ink:#edeae5;--muted:#b5afa7;--copper:#d9a47c;--line:#4a4a52;background:linear-gradient(#07070a,#141419,#1e1e25);color:var(--ink);border-radius:24px;max-width:460px;margin:auto;overflow:hidden;box-shadow:0 10px 40px #0002}
.stage.light{--bg:#f7f5f2;--surface:#f2efea;--ink:#1c1b19;--muted:#5a554e;--copper:#8a5a3b;--line:#bcb5ac;background:linear-gradient(#fff,#f4f1ec,#e8e3da)}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
button{font:inherit;cursor:pointer;color:inherit}header strong{font-weight:600;font-size:22px}header button{border:0;border-radius:50%;background:var(--surface);width:48px;height:48px;font-size:21px}
main{padding:24px;min-height:454px;background-image:radial-gradient(circle,#b5afa712 1px,transparent 1.2px);background-size:22px 22px}
h1{font-size:23px;font-weight:600;letter-spacing:-.5px;margin:0 0 5px}h2{font-size:14px;margin:24px 0 6px;font-weight:600}p{line-height:1.6;margin:8px 0}.sub{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);padding:18px;border:1px solid color-mix(in srgb,var(--line) 50%,transparent);border-radius:18px;margin-top:18px}
.month{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}.month span:last-child{letter-spacing:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stats strong{display:block;font-size:22px;font-weight:500}.stats small{font-size:10px;color:var(--muted)}
.bars{display:flex;gap:6px;align-items:end;height:42px;margin-top:20px}.bars i{flex:1;background:var(--copper);border-radius:3px;opacity:.7}
.row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 35%,transparent)}.row:last-child{border-bottom:0}.row .glyph{color:var(--copper);font-size:20px;width:23px}.row .body{flex:1;min-width:0}.row strong{display:block;font-size:14px;font-weight:500}.row p{font-size:12px;color:var(--muted);margin:5px 0 0}.row time{font-size:11px;color:var(--muted)}
.small-action{background:transparent;border:0;min-height:48px;min-width:48px;font-size:20px;color:var(--copper)}.action{background:var(--copper);border:0;border-radius:12px;color:var(--bg);padding:12px 18px;min-height:48px;font-size:14px;font-weight:600}.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
nav{display:flex;justify-content:space-around;border-top:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--bg);padding:8px}nav button{background:none;border:0;min-height:56px;flex:1;color:var(--muted);font-size:11px;display:grid;place-content:center;gap:4px}nav button b{font-size:19px;font-weight:400}nav button[aria-current=page]{color:var(--copper)}
.tools{display:flex;align-items:center;justify-content:space-between}.chip{border:1px solid var(--line);border-radius:20px;font-size:11px;padding:4px 8px;color:var(--muted)}progress{width:100%;accent-color:var(--copper);margin:18px 0 8px}footer{max-width:460px;margin:12px auto 0;font-size:12px;color:var(--muted-foreground,#777);line-height:1.6}button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
</style>
</head>
<body>
<p class="note">Layout proposal · example activity data · use the navigation and profile details to explore. The appearance button switches between Bram’s existing palettes.</p>
<section class="stage" aria-label="Proposed Bram interface">
<header><strong>Bram</strong><button id="appearance" aria-label="Switch light or dark appearance">◐</button></header>
<main id="content"></main>
<nav aria-label="Proposed main navigation">
<button data-page="home" aria-current="page"><b aria-hidden="true">⌂</b>Home</button>
<button data-page="chats"><b aria-hidden="true">▤</b>Chats</button>
<button data-page="automations"><b aria-hidden="true">◷</b>Automations</button>
<button data-page="models"><b aria-hidden="true">▣</b>Models</button>
</nav>
</section>
<footer id="rationale">Home opens without loading a model. Recent activity links to existing conversations and runs.</footer>
<script>
const row=(glyph,title,detail,end='')=>`<div class="row"><span class="glyph" aria-hidden="true">${glyph}</span><div class="body"><strong>${title}</strong><p>${detail}</p></div>${end}</div>`;
const screens={
home:`<h1>Home</h1><div class="panel"><div class="month"><span>October 2026</span><span aria-hidden="true">‹ ›</span></div><div class="stats"><div><strong>24.8k</strong><small>Generated tokens</small></div><div><strong>36</strong><small>Completed runs</small></div><div><strong>82</strong><small>Tool calls</small></div></div><div class="bars" aria-label="Example daily activity">${[15,30,10,35,23,40,19,28,12,33,25,18,38,29].map(v=>`<i style="height:${v}px"></i>`).join('')}</div></div><h2>Recent</h2>${row('▤','Kotlin examples','Chat · Local model','<time>12 min ago</time>')}${row('◇','Read saved articles','Agent · Completed','<time>1 hour ago</time>')}${row('◷','Morning summary','Automation · Waiting for a model','<time>Today</time>')}<p><button class="action" data-page="chats">New chat</button></p>`,
chats:`<div class="tools"><h1>Chats</h1><button class="small-action" aria-label="New chat">＋</button></div><p class="sub">All chats · Agents</p>${row('▤','Kotlin examples','LFM2.5-2.6B · Local','<time>12 min ago</time>')}${row('◇','Read saved articles','Agent · Last run completed','<time>1 hour ago</time>')}<div class="panel"><strong>Agent runs</strong><p class="sub">Child work appears under its parent conversation. Open a run to inspect its tools, usage, and result.</p></div>`,
models:`<div class="tools"><h1>Models</h1><button class="small-action" aria-label="Add model" data-page="add">＋</button></div><p class="sub">Profiles · Files · Servers</p>${row('▣','LFM2.5-2.6B','CPU · 4K context · Loaded','<button class="small-action" aria-label="Open LFM profile details" data-page="profile">›</button>')}${row('▣','LFM2.5-2.6B · NPU','Hexagon · Needs validation','<button class="small-action" aria-label="Open NPU profile details" data-page="profile">›</button>')}<div class="panel"><strong>Configuration</strong><p class="sub">Measurements and advanced settings live in each profile’s detail view.</p><button class="action ghost" data-page="configure">View configuration layout</button></div>`,
profile:`<button class="small-action" aria-label="Back to models" data-page="models">‹</button><h1>LFM2.5-2.6B</h1><p class="sub">CPU · 4K context · Loaded</p><p class="sub">Overview · Performance · Settings</p><div class="panel"><div class="tools"><strong>Measured performance</strong><span class="chip">CPU</span></div>${row('↥','121 tok/s','Prompt processing')}${row('↦','20 tok/s','Generation · 17 tok/s at 4K depth')}<p class="sub">Illustrative layout using the captured benchmark’s values. Configuration and workload remain inspectable.</p></div><p><button class="action" data-page="configure">Configure</button> <button class="action ghost" data-page="models">Back</button></p>`,
configure:`<h1>Configure profile</h1><p class="sub">Chat · Balanced · Quick budget</p><div class="panel"><div class="tools"><strong>Comparing finalists</strong><span class="chip">Example state</span></div><progress value="72" max="100" aria-label="Example budget elapsed"></progress><div class="month"><span>Elapsed 1:26</span><span>Budget 2:00</span></div><p class="sub">Testing decode at 4K context. Two candidates remain after short probes.</p><button class="action ghost" data-page="profile">Cancel and keep current profile</button></div><h2>Backend status</h2>${row('▣','CPU','Incumbent · Validated')}${row('▣','Hexagon','Available · Candidate tested')}${row('▣','Vulkan','Excluded by current validation policy')}<p class="sub">Budget elapsed is not a claim that a fixed percentage of trials is complete.</p>`,
automations:`<div class="tools"><h1>Automations</h1><button class="small-action" aria-label="New automation">＋</button></div><p class="sub">Active · Paused · History</p>${row('◷','Morning summary','Weekdays · Around 09:00','<span class="chip">Active</span>')}${row('◷','Review saved notes','Sundays · Around 18:00','<span class="chip">Paused</span>')}<div class="panel"><strong>Morning summary</strong><p class="sub">Last run: waiting for a model<br>Next requested: Monday 09:00<br>Android may delay scheduled work.</p><button class="action ghost" data-page="chats">View run history</button></div>`,
add:`<button class="small-action" aria-label="Back to models" data-page="models">‹</button><h1>Add model</h1><p class="sub">Import a local file or connect a server.</p><div class="panel">${row('▣','Local model file','GGUF or LiteRT-LM','<span aria-hidden="true">›</span>')}${row('↗','Connect server','OpenAI-compatible endpoint','<span aria-hidden="true">›</span>')}</div><h2>Device recommendation</h2><p class="sub">A short size/format recommendation appears here after scanning. CPU, memory, and backend details expand on request.</p>`
};
const notes={home:'Home opens without loading a model. Recent activity links to existing conversations and runs.',models:'Compact rows expose state and one detail action. Rename, duplicate, export, and diagnostics move into the detail or overflow menu.',configure:'The planner changes the trial list as it learns. This progress bar represents the time budget, not a fixed number of candidates.',automations:'Schedules have their own destination. Each definition has model/agent settings, conditions, permissions, and linked run history.'};
function show(page){document.querySelector('#content').innerHTML=screens[page]||screens.home;document.querySelectorAll('nav button').forEach(b=>{const active=b.dataset.page===page||(['profile','configure','add'].includes(page)&&b.dataset.page==='models');if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelector('#rationale').textContent=notes[page]||'Design proposal only. Existing content and permission boundaries are preserved.'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)show(b.dataset.page)});
document.querySelector('#appearance').onclick=()=>document.querySelector('.stage').classList.toggle('light');show('home');
</script>
</body>
</html>

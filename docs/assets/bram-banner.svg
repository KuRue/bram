<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Bram — Android AI runtime.</title>
  <desc id="desc">Bram's dark theme: a staggered dot field, copper accents, and the app's dotted lowercase b launcher mark.</desc>
  <!-- Palette: Theme.kt. Field: Background.kt. Mark coordinates: tools/icon.py. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07070A"/><stop offset=".5" stop-color="#141419"/><stop offset="1" stop-color="#1E1E25"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white" stop-opacity=".20"/><stop offset=".5" stop-color="white" stop-opacity=".09"/><stop offset="1" stop-color="white" stop-opacity=".03"/></linearGradient>

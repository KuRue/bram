    <mask id="texture"><rect width="1280" height="400" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#field)"/>
  <rect width="1280" height="400" rx="24" fill="url(#lattice)" mask="url(#texture)"/>

    <rect x="-59" y="-103" width="118" height="206" rx="23" fill="#171d33" stroke="url(#accent)" stroke-width="3"/>
    <path d="M-18-86H18" stroke="#9ca9ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M-28 17L0-27L28 17L0 46Z M-28 17H28 M0-27V46" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-17 84H17" stroke="#9ca9ff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <g fill="#7be3cf"><circle cx="-146" r="5"/><circle cx="146" r="5"/><circle cy="-146" r="5"/><circle cy="146" r="5"/></g>
    <g fill="#9ca9ff"><circle cx="-103" cy="-103" r="5"/><circle cx="103" cy="103" r="5"/></g>

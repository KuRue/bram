<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Bram — Intelligence, on your terms.</title>
  <desc id="desc">A dark indigo banner with an abstract network around a phone, representing private, local AI.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111629"/><stop offset="1" stop-color="#242342"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#9ca9ff"/><stop offset="1" stop-color="#7be3cf"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <text x="72" y="87" fill="#7be3cf" font-family="sans-serif" font-size="15" letter-spacing="4">LOCAL AI · ANDROID</text>
  <text x="68" y="191" fill="#f5f5ff" font-family="sans-serif" font-size="100" font-weight="700" letter-spacing="-4">Bram</text>
  <text x="72" y="252" fill="#d4d7ee" font-family="sans-serif" font-size="29">Intelligence, on your terms.</text>
  <text x="72" y="313" fill="#9ca5c2" font-family="sans-serif" font-size="18">Private models. Useful tools. Hardware that earns your trust.</text>
  <g transform="translate(978 200)" fill="none">
